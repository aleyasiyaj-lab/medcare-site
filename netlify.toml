[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."

# Route eligibility check to local Netlify function
[[redirects]]
  from = "/api/check-eligibility"
  to = "/.netlify/functions/check-eligibility"
  status = 200
  force = true

[[redirects]]
  from = "/.netlify/functions/:name"
  to = "/.netlify/functions/:name"
  status = 200
